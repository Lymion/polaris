<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="512" height="512">
  <title>Polaris</title>
  <defs>
    <radialGradient id="orb" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset=".6" stop-color="#2450B8"/>
      <stop offset="1" stop-color="#1C3F9A"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD3FF" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#7FB4FF"/>
      <stop offset="1" stop-color="#FFC861"/>
    </linearGradient>
    <linearGradient id="goldL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C2"/>
      <stop offset="1" stop-color="#FFC24D"/>
    </linearGradient>
    <linearGradient id="goldD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A531"/>
      <stop offset="1" stop-color="#E0661F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="orbClip"><circle cx="100" cy="104" r="80"/></clipPath>
    <clipPath id="sparkClip"><path d="M100,46 Q111,93 158,104 Q111,115 100,162 Q89,115 42,104 Q89,93 100,46 Z"/></clipPath>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <polygon points="0,-10 -2,-2 0,0" fill="#FFFFFF"/>
      <polygon points="0,-10 2,-2 0,0" fill="#BFD4FF"/>
      <polygon points="10,0 2,-2 0,0" fill="#FFFFFF"/>
      <polygon points="10,0 2,2 0,0" fill="#BFD4FF"/>
      <polygon points="0,10 2,2 0,0" fill="#BFD4FF"/>
      <polygon points="0,10 -2,2 0,0" fill="#FFFFFF"/>
      <polygon points="-10,0 -2,2 0,0" fill="#BFD4FF"/>
      <polygon points="-10,0 -2,-2 0,0" fill="#FFFFFF"/>
    </symbol>
  </defs>
  <circle cx="100" cy="104" r="80" fill="url(#orb)"/>
  <path d="M38 76 A64 64 0 0 1 120 42" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
  <polygon clip-path="url(#orbClip)" points="10,184 38,150 62,122 80,136 124,74 142,82 166,60 192,36 192,190 10,190" fill="url(#area)"/>
  <polyline points="40,154 64,126 82,140 126,78 144,86 168,64" fill="none" stroke="#050D24" stroke-opacity=".55" stroke-width="5" stroke-linejoin="miter"/>
  <polyline points="38,150 62,122 80,136 124,74 142,82 166,60" fill="none" stroke="url(#trail)" stroke-width="4.5" stroke-linejoin="miter"/>
  <use href="#spark" x="31" y="143" width="14" height="14"/>
  <use href="#spark" x="54" y="114" width="16" height="16"/>
  <use href="#spark" x="73" y="129" width="14" height="14"/>
  <use href="#spark" x="115" y="65" width="18" height="18"/>
  <use href="#spark" x="135" y="75" width="14" height="14"/>
  <use href="#spark" x="157" y="51" width="18" height="18"/>
  <circle cx="100" cy="104" r="46" fill="url(#halo)"/>
  <path d="M100,46 Q111,93 158,104 Q111,115 100,162 Q89,115 42,104 Q89,93 100,46 Z" fill="url(#goldD)" stroke="#F7A531" stroke-width="5" stroke-linejoin="round"/>
  <g clip-path="url(#sparkClip)">
    <polygon points="100,104 300,104 300,-96" fill="url(#goldL)"/>
    <polygon points="100,104 100,-100 -100,-100 -100,104" fill="url(#goldL)"/>
    <polygon points="100,104 -100,304 100,304" fill="url(#goldL)"/>
  </g>
  <ellipse cx="88" cy="88" rx="5" ry="3" transform="rotate(-45 88 88)" fill="#FFFFFF" fill-opacity=".7"/>
</svg>
