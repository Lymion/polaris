<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Polaris Logo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Grand+Hotel&family=Lobster&family=Pacifico&family=Oleo+Script:wght@700&family=Cookie&family=Berkshire+Swash&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root { --navy:#0B1B3F; --gold:#F5B942; --cream:#FFF6E3; }
  body { margin:0; padding:32px 16px; background:#F3F1EC; font-family:Inter, system-ui, sans-serif; color:#1b2440; }
  h1 { font-weight:500; font-size:20px; margin:0 0 4px; }
  p.sub { margin:0 0 24px; color:#5a6380; font-size:14px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:20px; max-width:1100px; }
  .card { border-radius:16px; overflow:hidden; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .dark { background:radial-gradient(120% 120% at 30% 20%, #16295a 0%, #0B1B3F 55%, #060f26 100%); padding:36px 20px 28px; display:flex; flex-direction:column; align-items:center; }
  .light { background:#FFFDF8; padding:18px 20px; display:flex; align-items:center; justify-content:center; gap:10px; border-top:1px solid #eee; }
  .word { font-size:56px; line-height:1; margin-top:8px; background:linear-gradient(180deg, #FFFFFF 10%, #FFE2A6 60%, #F5B942 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding:0 8px 10px; }
  .light .word { font-size:34px; margin:0; background:linear-gradient(180deg, #1E3A8A, #0B1B3F); -webkit-background-clip:text; background-clip:text; }
  .label { font-size:12px; color:#5a6380; padding:10px 16px; border-top:1px solid #eee; }
  .f1 { font-family:'Grand Hotel', cursive; }
  .f2 { font-family:'Lobster', cursive; }
  .f3 { font-family:'Pacifico', cursive; font-size:48px; }
  .light .f3 { font-size:28px; }
  .f4 { font-family:'Oleo Script', cursive; font-weight:700; }
  .f5 { font-family:'Cookie', cursive; font-size:66px; }
  .light .f5 { font-size:40px; }
  .f6 { font-family:'Berkshire Swash', cursive; }
  .icons { display:flex; gap:20px; align-items:flex-end; margin-top:28px; flex-wrap:wrap; }
  .app { border-radius:22%; overflow:hidden; box-shadow:0 6px 18px rgba(11,27,63,.25); }
</style>
</head>
<body>
<h1>Polaris: constellation growth mark</h1>
<p class="sub">Sharp zigzag growth graph drawn as a constellation, with background stars on every corner and the faceted North Star in front. Softer curved North Star. Retro script wordmarks in the Grand Hotel family.</p>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <radialGradient id="orb" cx="42%" cy="36%" r="70%">
      <stop offset="0" stop-color="#3B6FE0"/>
      <stop offset=".6" stop-color="#2450B8"/>
      <stop offset="1" stop-color="#1C3F9A"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6FD3FF" stop-opacity=".15"/>
      <stop offset=".55" stop-color="#7FB4FF"/>
      <stop offset="1" stop-color="#FFC861"/>
    </linearGradient>
    <linearGradient id="goldL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF1C2"/>
      <stop offset="1" stop-color="#FFC24D"/>
    </linearGradient>
    <linearGradient id="goldD" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7A531"/>
      <stop offset="1" stop-color="#E0661F"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FFD27A" stop-opacity=".55"/>
      <stop offset="1" stop-color="#FFD27A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B8DEF" stop-opacity=".35"/>
      <stop offset="1" stop-color="#5B8DEF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="orbClip"><circle cx="100" cy="104" r="80"/></clipPath>
    <clipPath id="sparkClip"><path d="M100,46 Q111,93 158,104 Q111,115 100,162 Q89,115 42,104 Q89,93 100,46 Z"/></clipPath>
    <symbol id="spark" viewBox="-10 -10 20 20">
      <polygon points="0,-10 -2,-2 0,0" fill="#FFFFFF"/>
      <polygon points="0,-10 2,-2 0,0" fill="#BFD4FF"/>
      <polygon points="10,0 2,-2 0,0" fill="#FFFFFF"/>
      <polygon points="10,0 2,2 0,0" fill="#BFD4FF"/>
      <polygon points="0,10 2,2 0,0" fill="#BFD4FF"/>
      <polygon points="0,10 -2,2 0,0" fill="#FFFFFF"/>
      <polygon points="-10,0 -2,2 0,0" fill="#BFD4FF"/>
      <polygon points="-10,0 -2,-2 0,0" fill="#FFFFFF"/>
    </symbol>
    <symbol id="mark" viewBox="0 0 200 200">
      <circle cx="100" cy="104" r="80" fill="url(#orb)"/>
      <path d="M38 76 A64 64 0 0 1 120 42" fill="none" stroke="#ffffff" stroke-opacity=".18" stroke-width="5" stroke-linecap="round"/>
      <polygon clip-path="url(#orbClip)" points="10,184 38,150 62,122 80,136 124,74 142,82 166,60 192,36 192,190 10,190" fill="url(#area)"/>
      <polyline points="40,154 64,126 82,140 126,78 144,86 168,64" fill="none" stroke="#050D24" stroke-opacity=".55" stroke-width="5" stroke-linejoin="miter"/>
      <polyline points="38,150 62,122 80,136 124,74 142,82 166,60" fill="none" stroke="url(#trail)" stroke-width="4.5" stroke-linejoin="miter"/>
      <use href="#spark" x="31" y="143" width="14" height="14"/>
      <use href="#spark" x="54" y="114" width="16" height="16"/>
      <use href="#spark" x="73" y="129" width="14" height="14"/>
      <use href="#spark" x="115" y="65" width="18" height="18"/>
      <use href="#spark" x="135" y="75" width="14" height="14"/>
      <use href="#spark" x="157" y="51" width="18" height="18"/>
      <circle cx="100" cy="104" r="46" fill="url(#halo)"/>
      <path d="M100,46 Q111,93 158,104 Q111,115 100,162 Q89,115 42,104 Q89,93 100,46 Z" fill="url(#goldD)" stroke="#F7A531" stroke-width="5" stroke-linejoin="round"/>
      <g clip-path="url(#sparkClip)">
        <polygon points="100,104 300,104 300,-96" fill="url(#goldL)"/>
        <polygon points="100,104 100,-100 -100,-100 -100,104" fill="url(#goldL)"/>
        <polygon points="100,104 -100,304 100,304" fill="url(#goldL)"/>
      </g>
      <ellipse cx="88" cy="88" rx="5" ry="3" transform="rotate(-45 88 88)" fill="#FFFFFF" fill-opacity=".7"/>
    </symbol>
  </defs>
</svg>

<div class="grid" id="grid"></div>
<script>
  const fonts = [
    ['f1', 'Grand Hotel', 'your favourite, for reference'],
    ['f2', 'Lobster', 'thick, bold retro script, very iconic'],
    ['f3', 'Pacifico', 'round, surf-style brush, bubbly'],
    ['f4', 'Oleo Script Bold', 'heavy, punchy, classic diner sign'],
    ['f5', 'Cookie', 'lighter, sweet vintage script'],
    ['f6', 'Berkshire Swash', 'retro with decorative swashes'],
  ];
  document.getElementById('grid').innerHTML = fonts.map(([cls, name, note], i) => `
    <div class="card">
      <div class="dark"><svg width="150" height="150"><use href="#mark"/></svg><div class="word ${cls}">Polaris</div></div>
      <div class="light"><svg width="44" height="44"><use href="#mark"/></svg><span class="word ${cls}">Polaris</span></div>
      <div class="label">Option ${i + 1}: ${name} (${note})</div>
    </div>`).join('');
</script>

<div class="icons">
  <div class="app" style="width:120px;height:120px;background:#0B1B3F"><svg width="120" height="120" viewBox="0 0 200 200"><use href="#mark"/></svg></div>
  <div class="app" style="width:64px;height:64px;background:#0B1B3F"><svg width="64" height="64" viewBox="0 0 200 200"><use href="#mark"/></svg></div>
  <svg width="32" height="32"><use href="#mark"/></svg>
  <span style="font-size:12px;color:#5a6380">App icon and favicon sizes</span>
</div>
</body>
</html>
